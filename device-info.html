<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 단말기 정보 검색</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d1a;--bg2:#13132a;--bg3:#1a1a35;--bg4:#22224a;
  --accent:#7c83fd;--accent2:#a78bfa;--text:#e0e0f0;--muted:#8888aa;
  --border:#2a2a50;--card:#161630;--success:#34d399;--warn:#fbbf24
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* HEADER */
header{background:linear-gradient(135deg,#1a1a35,#0f0f25);padding:22px 20px 18px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
header h1{font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:3px}
header p{color:var(--muted);font-size:.8rem}

/* TABS */
nav{display:flex;justify-content:center;gap:8px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab-btn{padding:9px 22px;border:1px solid var(--border);border-radius:30px;cursor:pointer;font-size:.9rem;font-weight:500;transition:.25s all;background:transparent;color:var(--muted)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 18px rgba(124,131,253,.35)}
.tab-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}

/* SEARCH SECTION */
.search-box{padding:18px 20px 12px;background:var(--bg2)}
.search-row{display:flex;gap:8px;max-width:860px;margin:0 auto 12px}
.search-row input{flex:1;padding:11px 18px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.95rem;transition:.2s border-color}
.search-row input:focus{outline:none;border-color:var(--accent)}
.search-row input::placeholder{color:var(--muted)}
.search-row button{padding:11px 22px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:600;transition:.2s}
.search-row button:hover{background:#6a71f0}
.filter-row{display:flex;gap:8px;max-width:860px;margin:0 auto;flex-wrap:wrap}
.filter-row select{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.85rem;cursor:pointer;flex-shrink:0}
.filter-row select:focus{outline:none;border-color:var(--accent)}
.stats{text-align:center;padding:8px;color:var(--muted);font-size:.82rem}

/* DEVICE GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:16px 20px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:.25s all;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,transparent,rgba(124,131,253,.04));opacity:0;transition:.25s}
.card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 10px 30px rgba(124,131,253,.2)}
.card:hover::before{opacity:1}
.brand-tag{display:inline-block;padding:2px 10px;background:rgba(124,131,253,.15);border:1px solid rgba(124,131,253,.3);border-radius:20px;font-size:.72rem;color:var(--accent);margin-bottom:9px;font-weight:600;letter-spacing:.3px}
.card h3{font-size:1rem;font-weight:700;margin-bottom:4px;color:#fff}
.card .year-tag{color:var(--muted);font-size:.8rem;margin-bottom:12px}
.spec-rows{list-style:none;font-size:.82rem}
.spec-rows li{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.spec-rows li:last-child{border:none}
.spec-rows li .k{color:var(--muted)}
.spec-rows li .v{color:var(--text);text-align:right;max-width:60%;font-size:.8rem}
.badge-ux{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600;color:#fff}

/* NO RESULTS */
.no-result{text-align:center;padding:60px 20px;color:var(--muted);font-size:1rem}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;max-width:580px;width:100%;max-height:92vh;overflow-y:auto;padding:28px}
.modal::-webkit-scrollbar{width:5px}
.modal::-webkit-scrollbar-track{background:var(--bg3)}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.modal-head .info h2{font-size:1.3rem;color:#fff;margin-bottom:2px}
.modal-head .info p{color:var(--muted);font-size:.82rem}
.modal-close{background:var(--bg3);border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.modal-close:hover{color:#fff;border-color:var(--accent)}
.msec{background:var(--bg3);border-radius:10px;padding:15px;margin-bottom:12px}
.msec-title{color:var(--accent);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.mtable{width:100%;border-collapse:collapse;font-size:.85rem}
.mtable tr{border-bottom:1px solid var(--border)}
.mtable tr:last-child{border:none}
.mtable td{padding:8px 4px}
.mtable td:first-child{color:var(--muted);width:42%}
.gsm-link{display:block;text-align:center;margin-top:16px;padding:10px;background:rgba(124,131,253,.1);border:1px solid rgba(124,131,253,.3);border-radius:8px;color:var(--accent);font-size:.85rem;transition:.2s}
.gsm-link:hover{background:rgba(124,131,253,.2);text-decoration:none}

/* CONVERTER */
#convTab{display:none;padding:20px;max-width:960px;margin:0 auto}
.conv-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:18px}
.conv-card h2{font-size:1.2rem;color:var(--accent);margin-bottom:4px}
.conv-card>p{color:var(--muted);font-size:.85rem;margin-bottom:20px}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:.25s;margin-bottom:20px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(124,131,253,.05)}
.upload-zone .ico{font-size:2.5rem;margin-bottom:8px}
.upload-zone .main{color:var(--text);font-size:.9rem;margin-bottom:4px}
.upload-zone .sub{color:var(--muted);font-size:.78rem}
.conv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.cg{display:flex;flex-direction:column;gap:6px}
.cg label{color:var(--muted);font-size:.8rem;font-weight:600}
.cg select,.cg .res-pair input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:.85rem;width:100%}
.cg select:focus,.cg .res-pair input:focus{outline:none;border-color:var(--accent)}
.res-pair{display:flex;gap:6px;align-items:center}
.res-pair span{color:var(--muted);font-size:.9rem}
.fit-toggle{display:flex;gap:8px;margin-bottom:16px}
.fit-btn{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;transition:.2s}
.fit-btn.active{background:rgba(124,131,253,.2);border-color:var(--accent);color:var(--accent)}
.convert-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s}
.convert-btn:hover{background:#6a71f0}
.conv-result{display:none;margin-top:20px}
.result-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.result-frame{flex:1;min-width:200px;text-align:center}
.result-frame .frame-label{color:var(--muted);font-size:.8rem;margin-bottom:8px;font-weight:600}
.result-frame .frame-name{color:#fff;font-size:.9rem;margin-bottom:4px;font-weight:700}
.result-frame canvas{max-width:100%;border-radius:10px;border:1px solid var(--border);display:block;margin:0 auto}
.result-frame .res-info{color:var(--muted);font-size:.75rem;margin-top:6px}
.arrow-sep{display:flex;align-items:center;padding:20px 10px;color:var(--accent);font-size:1.8rem;align-self:center}
.download-btn{display:block;margin-top:10px;padding:7px 16px;background:rgba(124,131,253,.15);border:1px solid rgba(124,131,253,.3);border-radius:8px;color:var(--accent);font-size:.8rem;cursor:pointer;width:100%;text-align:center;transition:.2s}
.download-btn:hover{background:rgba(124,131,253,.3)}
.conv-info-box{background:var(--bg3);border-radius:8px;padding:12px;margin-top:16px;font-size:.82rem;color:var(--muted);line-height:1.6}
.conv-info-box strong{color:var(--text)}

@media(max-width:600px){
  .conv-grid{grid-template-columns:1fr}
  .result-wrap{flex-direction:column}
  .arrow-sep{transform:rotate(90deg);align-self:center;padding:0;margin:10px auto}
  header h1{font-size:1.3rem}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <h1>📱 단말기 정보 검색</h1>
  <p>스마트폰 스펙 검색 · 게임 스크린샷 해상도 변환 · 출처 참조: GSMArena</p>
</header>

<nav>
  <button class="tab-btn active" onclick="showTab('search',this)">🔍 단말기 검색</button>
  <button class="tab-btn" onclick="showTab('conv',this)">🖼️ 해상도 변환</button>
</nav>

<!-- ===== SEARCH TAB ===== -->
<div id="searchTab">
  <div class="search-box">
    <div class="search-row">
      <input type="text" id="q" placeholder="단말기 이름, 브랜드, 칩셋, UX 검색..." oninput="doFilter()">
      <button onclick="doFilter()">검색</button>
    </div>
    <div class="filter-row">
      <select id="fBrand" onchange="doFilter()">
        <option value="">모든 브랜드</option>
        <option>Samsung</option><option>Apple</option><option>Google</option>
        <option>OnePlus</option><option>Xiaomi</option><option>Sony</option>
        <option>Motorola</option><option>ASUS</option><option>LG</option>
      </select>
      <select id="fOS" onchange="doFilter()">
        <option value="">모든 OS</option>
        <option value="Android">Android</option>
        <option value="iOS">iOS</option>
      </select>
      <select id="fYear" onchange="doFilter()">
        <option value="">모든 연도</option>
        <option>2024</option><option>2023</option><option>2022</option>
        <option>2021</option><option>2020</option>
      </select>
      <select id="fSort" onchange="doFilter()">
        <option value="year">최신순</option>
        <option value="name">이름순</option>
        <option value="display">화면 크기순</option>
        <option value="ppi">픽셀밀도순</option>
      </select>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- ===== CONVERTER TAB ===== -->
<div id="convTab">
  <div class="conv-card">
    <h2>🖼️ 게임 스크린샷 해상도 변환기</h2>
    <p>특정 단말기의 게임 스크린샷을 다른 단말기의 화면 해상도로 변환해 미리볼 수 있습니다.</p>

    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('imgInput').click()">
      <div class="ico">📤</div>
      <div class="main">클릭하거나 이미지를 드래그하여 업로드</div>
      <div class="sub">PNG · JPG · WEBP · GIF 지원</div>
    </div>
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="onUpload(event)">

    <div class="conv-grid">
      <div class="cg">
        <label>원본 단말기 선택</label>
        <select id="srcDev" onchange="onSrcDevChange()">
          <option value="manual">직접 입력</option>
        </select>
      </div>
      <div class="cg">
        <label>대상 단말기 선택</label>
        <select id="dstDev" onchange="onDstDevChange()">
        </select>
      </div>
      <div class="cg">
        <label>원본 해상도 (픽셀)</label>
        <div class="res-pair">
          <input type="number" id="srcW" placeholder="너비" value="1080">
          <span>×</span>
          <input type="number" id="srcH" placeholder="높이" value="2400">
        </div>
      </div>
      <div class="cg">
        <label>대상 해상도 (픽셀)</label>
        <div class="res-pair">
          <input type="number" id="dstW" placeholder="너비" value="1440">
          <span>×</span>
          <input type="number" id="dstH" placeholder="높이" value="3088">
        </div>
      </div>
    </div>

    <div style="margin-bottom:14px">
      <div style="color:var(--muted);font-size:.8rem;margin-bottom:6px;font-weight:600">변환 방식</div>
      <div class="fit-toggle">
        <button class="fit-btn active" id="fitBtn" onclick="setFit('fit',this)">📐 맞춤 (Fit) — 비율 유지, 여백 표시</button>
        <button class="fit-btn" id="fillBtn" onclick="setFit('fill',this)">✂️ 채움 (Fill) — 화면 가득, 잘림 허용</button>
      </div>
    </div>

    <button class="convert-btn" onclick="doConvert()">🔄 해상도 변환 미리보기</button>

    <div class="conv-result" id="convResult">
      <div class="result-wrap">
        <div class="result-frame" id="srcFrame">
          <div class="frame-label">원본</div>
          <div class="frame-name" id="srcFrameName">—</div>
          <canvas id="srcCanvas"></canvas>
          <div class="res-info" id="srcResInfo"></div>
        </div>
        <div class="arrow-sep">→</div>
        <div class="result-frame" id="dstFrame">
          <div class="frame-label">변환 결과</div>
          <div class="frame-name" id="dstFrameName">—</div>
          <canvas id="dstCanvas"></canvas>
          <div class="res-info" id="dstResInfo"></div>
          <button class="download-btn" onclick="downloadResult()">⬇️ 변환 이미지 저장</button>
        </div>
      </div>
      <div class="conv-info-box" id="convInfoBox"></div>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="info">
        <h2 id="mTitle"></h2>
        <p id="mSub"></p>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

// UX badge colors
const uxColors={
  'One UI':'#1428A0','iOS':'#555555','Stock Android':'#34A853',
  'OxygenOS':'#F05100','HyperOS':'#FF6900','MIUI':'#FF4A00',
  'My UX':'#EA3735','ROG UI':'#9C1AFF','ZenUI':'#00BBFF',
  'LG UX':'#A50034'
};
function uxColor(ux){
  for(const k in uxColors) if(ux.includes(k)) return uxColors[k];
  return '#7c83fd';
}

// ===== FILTER & RENDER =====
let filtered=[...DB];
function doFilter(){
  const q=document.getElementById('q').value.toLowerCase();
  const b=document.getElementById('fBrand').value;
  const o=document.getElementById('fOS').value;
  const y=document.getElementById('fYear').value;
  const s=document.getElementById('fSort').value;
  filtered=DB.filter(d=>{
    if(b&&d.brand!==b) return false;
    if(o&&!d.os.includes(o)) return false;
    if(y&&d.year!==+y) return false;
    if(q&&!`${d.brand} ${d.name} ${d.chip} ${d.ux} ${d.os}`.toLowerCase().includes(q)) return false;
    return true;
  });
  if(s==='year') filtered.sort((a,b)=>b.year-a.year);
  else if(s==='name') filtered.sort((a,b)=>a.name.localeCompare(b.name));
  else if(s==='display') filtered.sort((a,b)=>b.disp.inch-a.disp.inch);
  else if(s==='ppi') filtered.sort((a,b)=>b.disp.ppi-a.disp.ppi);
  render();
}

function render(){
  const g=document.getElementById('grid');
  document.getElementById('stats').textContent=`총 ${filtered.length}개 단말기 (전체 ${DB.length}개)`;
  if(!filtered.length){
    g.innerHTML='<div class="no-result" style="grid-column:1/-1">😔 검색 결과가 없습니다.<br>다른 키워드로 시도해보세요.</div>';
    return;
  }
  g.innerHTML=filtered.map(d=>`
    <div class="card" onclick="openModal(${d.id})">
      <span class="brand-tag">${d.brand}</span>
      <h3>${d.name}</h3>
      <div class="year-tag">${d.year}년 출시</div>
      <ul class="spec-rows">
        <li><span class="k">프로세서</span><span class="v">${d.chip}</span></li>
        <li><span class="k">메모리</span><span class="v">${d.ram}</span></li>
        <li><span class="k">화면 크기</span><span class="v">${d.disp.inch}" · ${d.disp.ppi}ppi</span></li>
        <li><span class="k">해상도</span><span class="v">${d.disp.w}×${d.disp.h}</span></li>
        <li><span class="k">운영체제</span><span class="v">${d.os}</span></li>
        <li><span class="k">UX</span><span class="v"><span class="badge-ux" style="background:${uxColor(d.ux)}">${d.ux}</span></span></li>
      </ul>
    </div>
  `).join('');
}

let uploadedImg=null;
let fitMode='fit';

function setFit(mode,btn){
  fitMode=mode;
  document.querySelectorAll('.fit-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function populateSelects(){
  const src=document.getElementById('srcDev');
  const dst=document.getElementById('dstDev');
  src.innerHTML='<option value="manual">직접 입력</option>';
  dst.innerHTML='';
  DB.forEach(d=>{
    const label=`${d.brand} ${d.name} (${d.disp.w}×${d.disp.h})`;
    src.appendChild(new Option(label,d.id));
    dst.appendChild(new Option(label,d.id));
  });
}

function onSrcDevChange(){
  const v=document.getElementById('srcDev').value;
  if(v==='manual') return;
  const d=DB.find(x=>x.id===+v);
  if(d){document.getElementById('srcW').value=d.disp.w; document.getElementById('srcH').value=d.disp.h;}
}
function onDstDevChange(){
  const d=DB.find(x=>x.id===+document.getElementById('dstDev').value);
  if(d){document.getElementById('dstW').value=d.disp.w; document.getElementById('dstH').value=d.disp.h;}
}

function onUpload(e){
  const file=e.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      uploadedImg=img;
      const zone=document.getElementById('uploadZone');
      zone.innerHTML=`<div style="color:var(--success);font-size:1.5rem;margin-bottom:8px">✓ 업로드 완료</div>
        <div class="main">${file.name}</div>
        <div class="sub">${img.width} × ${img.height} px · ${(file.size/1024).toFixed(0)} KB</div>`;
      document.getElementById('srcW').value=img.width;
      document.getElementById('srcH').value=img.height;
      document.getElementById('srcDev').value='manual';
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}

// drag & drop
const zone=document.getElementById('uploadZone');
zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
zone.addEventListener('drop',e=>{
  e.preventDefault(); zone.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/')){
    const dt=new DataTransfer(); dt.items.add(f);
    document.getElementById('imgInput').files=dt.files;
    onUpload({target:{files:[f]}});
  }
});

const MAX_DISPLAY=360;

function doConvert(){
  if(!uploadedImg){alert('먼저 스크린샷 이미지를 업로드해주세요!'); return;}
  const sw=+document.getElementById('srcW').value||uploadedImg.width;
  const sh=+document.getElementById('srcH').value||uploadedImg.height;
  const dw=+document.getElementById('dstW').value;
  const dh=+document.getElementById('dstH').value;
  if(!dw||!dh){alert('대상 해상도를 입력해주세요!'); return;}

  // src canvas
  const sc=document.getElementById('srcCanvas');
  const sCtx=sc.getContext('2d');
  const sScale=Math.min(MAX_DISPLAY/sw, MAX_DISPLAY*2/sh);
  sc.width=Math.round(sw*sScale); sc.height=Math.round(sh*sScale);
  sCtx.drawImage(uploadedImg,0,0,sc.width,sc.height);

  // dst canvas
  const dc=document.getElementById('dstCanvas');
  const dCtx=dc.getContext('2d');
  const dScale=Math.min(MAX_DISPLAY/dw, MAX_DISPLAY*2/dh);
  dc.width=Math.round(dw*dScale); dc.height=Math.round(dh*dScale);

  dCtx.fillStyle='#000';
  dCtx.fillRect(0,0,dc.width,dc.height);

  const imgAsp=sw/sh, dstAsp=dw/dh;
  let px,py,pw,ph;
  if(fitMode==='fit'){
    if(imgAsp>dstAsp){pw=dc.width;ph=dc.width/imgAsp;px=0;py=(dc.height-ph)/2;}
    else{ph=dc.height;pw=dc.height*imgAsp;px=(dc.width-pw)/2;py=0;}
  } else {
    if(imgAsp>dstAsp){ph=dc.height;pw=dc.height*imgAsp;px=(dc.width-pw)/2;py=0;}
    else{pw=dc.width;ph=dc.width/imgAsp;px=0;py=(dc.height-ph)/2;}
  }
  dCtx.drawImage(uploadedImg,px,py,pw,ph);

  // Labels
  const srcV=document.getElementById('srcDev').value;
  const dstV=document.getElementById('dstDev').value;
  const srcName=srcV==='manual'?'원본':(DB.find(x=>x.id===+srcV)?.name||'원본');
  const dstDev=DB.find(x=>x.id===+dstV);
  const dstName=dstDev?.name||'변환 결과';
  document.getElementById('srcFrameName').textContent=srcName;
  document.getElementById('dstFrameName').textContent=dstName;
  document.getElementById('srcResInfo').textContent=`${sw} × ${sh} px`;
  document.getElementById('dstResInfo').textContent=`${dw} × ${dh} px`;

  // Info box
  const scaleX=(dw/sw*100).toFixed(1), scaleY=(dh/sh*100).toFixed(1);
  const pxRatio=(dw*dh)/(sw*sh);
  const ppiSrc=document.getElementById('srcDev').value!=='manual'?
    (DB.find(x=>x.id===+document.getElementById('srcDev').value)?.disp.ppi||'?'):'?';
  const ppiDst=dstDev?.disp.ppi||'?';
  document.getElementById('convInfoBox').innerHTML=`
    <strong>변환 정보</strong><br>
    • 원본 → 대상 해상도 비율: 가로 ${scaleX}% / 세로 ${scaleY}%<br>
    • 픽셀 수 변화: ${(sw*sh).toLocaleString()} → ${(dw*dh).toLocaleString()} px (${(pxRatio).toFixed(2)}x)<br>
    ${ppiSrc!=='?'?`• PPI: ${ppiSrc} → ${ppiDst} (픽셀 밀도 변화)<br>`:''}
    • 변환 방식: <strong>${fitMode==='fit'?'맞춤 (Fit) — 비율 유지, 여백 표시':'채움 (Fill) — 화면 가득, 잘림 허용'}</strong>
  `;

  document.getElementById('convResult').style.display='block';
  document.getElementById('convResult').scrollIntoView({behavior:'smooth'});
}

function downloadResult(){
  const dc=document.getElementById('dstCanvas');
  const a=document.createElement('a');
  a.download=`converted_${document.getElementById('dstW').value}x${document.getElementById('dstH').value}.png`;
  a.href=dc.toDataURL('image/png');
  a.click();
}

// ===== INIT =====
populateSelects();
onDstDevChange();
doFilter();
</script>
</body>
</html>
