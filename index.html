<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 단말기 정보 검색</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d1a;--bg2:#12122a;--bg3:#1a1a35;--bg4:#22224a;--acc:#7c83fd;--acc2:#a78bfa;--text:#e0e0f0;--muted:#8888aa;--border:#2a2a50;--card:#161630;--ok:#34d399}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
header{background:linear-gradient(135deg,#1a1a35,#0f0f25);padding:14px 20px 10px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(12px)}
header h1{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block}
header p{color:var(--muted);font-size:.72rem;margin-top:2px}
nav{display:flex;justify-content:center;gap:6px;padding:10px;background:var(--bg2);border-bottom:1px solid var(--border)}
.tb{padding:8px 20px;border:1px solid var(--border);border-radius:30px;cursor:pointer;font-size:.85rem;font-weight:500;transition:.2s;background:transparent;color:var(--muted)}
.tb.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 0 14px rgba(124,131,253,.4)}
.tb:hover:not(.on){border-color:var(--acc);color:var(--acc)}
.page{display:none}.page.on{display:block}
.sbar{padding:14px 16px 10px;background:var(--bg2);position:sticky;top:72px;z-index:100;border-bottom:1px solid var(--border)}
.sr{display:flex;gap:8px;max-width:900px;margin:0 auto 10px}
.sr input{flex:1;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.9rem}
.sr input:focus{outline:none;border-color:var(--acc)}
.sr input::placeholder{color:var(--muted)}
.sr button{padding:10px 20px;background:var(--acc);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:.85rem;font-weight:600}
.frow{display:flex;gap:6px;max-width:900px;margin:0 auto;flex-wrap:wrap}
.frow select{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.8rem;cursor:pointer}
.frow select:focus{outline:none;border-color:var(--acc)}
.stats{text-align:center;padding:6px;color:var(--muted);font-size:.78rem}
.no-res{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px;padding:14px 16px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px;cursor:pointer;transition:.2s all}
.card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 8px 24px rgba(124,131,253,.2)}
.btag{display:inline-block;padding:2px 9px;background:rgba(124,131,253,.12);border:1px solid rgba(124,131,253,.25);border-radius:20px;font-size:.7rem;color:var(--acc);margin-bottom:7px;font-weight:600}
.card h3{font-size:.97rem;font-weight:700;margin-bottom:2px;color:#fff}
.card .yr{color:var(--muted);font-size:.75rem;margin-bottom:10px}
.srows{list-style:none;font-size:.8rem}
.srows li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.srows li:last-child{border:none}
.srows .k{color:var(--muted)}
.srows .v{color:var(--text);text-align:right;max-width:58%}
.ux-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.72rem;font-weight:600;color:#fff}
.brow{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.brow .bl{font-size:.72rem;color:var(--muted);margin-bottom:4px}
.bbar{height:6px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-bottom:3px}
.bbar .bf{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px)}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:600px;width:100%;max-height:93vh;overflow-y:auto;padding:24px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.mhead .mi h2{font-size:1.1rem;color:#fff;margin-bottom:2px}
.mhead .mi p{color:var(--muted);font-size:.78rem}
.mcls{background:var(--bg3);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.mcls:hover{color:#fff;border-color:var(--acc)}
.msec{background:var(--bg3);border-radius:10px;padding:13px;margin-bottom:10px}
.mst{color:var(--acc);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.mt{width:100%;border-collapse:collapse;font-size:.83rem}
.mt tr{border-bottom:1px solid var(--border)}
.mt tr:last-child{border:none}
.mt td{padding:7px 3px}
.mt td:first-child{color:var(--muted);width:40%}
.gsm-btn{display:block;text-align:center;margin-top:10px;padding:10px;background:rgba(124,131,253,.1);border:1px solid rgba(124,131,253,.3);border-radius:8px;color:var(--acc);font-size:.82rem;cursor:pointer;transition:.2s;text-decoration:none}
.gsm-btn:hover{background:rgba(124,131,253,.22);text-decoration:none}
#gsmRes{max-width:1440px;margin:0 auto;padding:0 16px 24px}
.gsr-hd{display:flex;align-items:center;gap:8px;color:var(--acc);font-size:.82rem;font-weight:700;padding:12px 0 8px;border-top:1px solid var(--border);margin-top:4px}
.gsr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gsr-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px}
.gsr-card:hover{border-color:var(--acc);background:rgba(124,131,253,.07)}
.gsr-thumb{width:40px;height:44px;object-fit:contain;border-radius:4px;flex-shrink:0;background:rgba(255,255,255,.04)}
.gsr-name{font-size:.82rem;font-weight:600;line-height:1.3;margin-bottom:2px}
.gsr-sub{font-size:.7rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.gsec-hd{color:var(--acc);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.gsec-tbl{width:100%;font-size:.82rem;margin-bottom:10px}
.gsec-tbl td{padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.03)}
.gsec-tbl td:first-child{color:var(--muted);width:42%}
.conv-wrap{padding:16px;max-width:960px;margin:0 auto}
.ccard{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:22px;margin-bottom:16px}
.ccard h2{font-size:1.1rem;color:var(--acc);margin-bottom:3px}
.ccard>p{color:var(--muted);font-size:.82rem;margin-bottom:18px}
.upzone{border:2px dashed var(--border);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;transition:.2s}
.upzone:hover,.upzone.drag{border-color:var(--acc);background:rgba(124,131,253,.05)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.cg label{display:block;color:var(--muted);font-size:.76rem;font-weight:600;margin-bottom:5px}
.cg select,.cg input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 11px;font-size:.83rem;width:100%}
.rpair{display:flex;gap:6px;align-items:center}
.rpair span{color:var(--muted)}
.ftog{display:flex;gap:8px;margin-bottom:14px}
.fb{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;transition:.2s}
.fb.on{background:rgba(124,131,253,.18);border-color:var(--acc);color:var(--acc)}
.cvbtn{width:100%;padding:13px;background:var(--acc);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s}
.cvbtn:hover{background:#6a71f0}
.rswrap{display:none;margin-top:18px}
.rsrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rsframe{flex:1;min-width:200px;text-align:center}
.rsframe .flab{color:var(--muted);font-size:.75rem;margin-bottom:4px;font-weight:600}
.rsframe .fnm{color:#fff;font-size:.85rem;margin-bottom:5px;font-weight:700}
.rsframe canvas{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.rsframe .ri{color:var(--muted);font-size:.72rem;margin-top:5px}
.rsarrow{display:flex;align-items:center;color:var(--acc);font-size:1.6rem;align-self:center}
.dlbtn{display:block;margin-top:8px;padding:6px 14px;background:rgba(124,131,253,.14);border:1px solid rgba(124,131,253,.3);border-radius:8px;color:var(--acc);font-size:.78rem;cursor:pointer;width:100%;text-align:center}
.cvinf{background:var(--bg3);border-radius:8px;padding:11px;margin-top:14px;font-size:.8rem;color:var(--muted);line-height:1.65}
.cvinf strong{color:var(--text)}
.ms-wrap{padding:16px;max-width:900px;margin:0 auto}
.ms-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:22px;margin-bottom:14px}
.ms-card h2{font-size:1.1rem;color:var(--acc);margin-bottom:3px}
.ms-card>p{color:var(--muted);font-size:.8rem;margin-bottom:18px}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.rtab{padding:6px 14px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.8rem;background:transparent;color:var(--muted);transition:.2s}
.rtab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rtab:hover:not(.on){border-color:var(--acc);color:var(--acc)}
.ms-title{font-size:1rem;font-weight:700;color:#fff;margin-bottom:4px}
.ms-sub{font-size:.77rem;color:var(--muted);margin-bottom:16px}
.ms-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ms-brand{width:88px;text-align:right;font-size:.8rem;color:var(--text);flex-shrink:0}
.ms-bar-wrap{flex:1;background:var(--bg4);border-radius:5px;height:22px;overflow:hidden}
.ms-bar-fill{height:100%;border-radius:5px;transition:.6s width;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:24px}
.ms-bar-pct{font-size:.74rem;font-weight:700;color:#fff;white-space:nowrap}
.ms-pct-out{font-size:.77rem;color:var(--muted);width:38px;text-align:right;flex-shrink:0}
.ms-src{font-size:.72rem;color:var(--muted);margin-top:12px;text-align:right}
#pieCanvas{display:block;margin:0 auto 12px;max-width:260px}
.pie-leg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.pl-i{display:flex;align-items:center;gap:4px;font-size:.77rem;color:var(--muted)}
.pl-d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
@media(max-width:600px){.cgrid{grid-template-columns:1fr}.rsrow{flex-direction:column}.rsarrow{transform:rotate(90deg);align-self:center}header h1{font-size:1.2rem}.ms-brand{width:70px;font-size:.75rem}}
</style>
</head>
<body>
<header>
  <h1>📱 단말기 정보 검색</h1>
  <p>2018년 이후 주요 스마트폰 · 벤치마크 · 시장 점유율 · 나무위키 연동</p>
</header>
<nav>
  <button class="tb on" onclick="goTab('search',this)">🔍 단말기 검색</button>
  <button class="tb" onclick="goTab('conv',this)">🖼️ 해상도 변환</button>
  <button class="tb" onclick="goTab('ms',this)">📊 시장 점유율</button>
</nav>
<div id="pg-search" class="page on">
  <div class="sbar">
    <div class="sr">
      <input type="text" id="q" placeholder="브랜드·모델명·칩셋·UX 검색 (한글/영문 가능)" oninput="debSearch()">
      <button onclick="doSearch()">검색</button>
    </div>
    <div class="frow">
      <select id="fBrand" onchange="doSearch()"><option value="">모든 브랜드</option></select>
      <select id="fOS" onchange="doSearch()"><option value="">모든 OS</option><option value="Android">Android</option><option value="iOS">iOS</option></select>
      <select id="fYear" onchange="doSearch()"><option value="">모든 연도</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option></select>
      <select id="fSort" onchange="doSearch()"><option value="year">최신순</option><option value="name">이름순</option><option value="display">화면크기순</option><option value="ppi">픽셀밀도순</option><option value="antutu">AnTuTu순</option></select>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div id="gsmRes"></div>
</div>
<div id="pg-conv" class="page">
<div class="conv-wrap"><div class="ccard">
  <h2>🖼️ 게임 스크린샷 해상도 변환기</h2>
  <p>특정 단말기의 게임 스크린샷이 다른 단말기 해상도에서 어떻게 보이는지 확인합니다.</p>
  <div class="upzone" id="upzone" onclick="document.getElementById('fimg').click()">
    <div style="font-size:2.2rem;margin-bottom:6px">📤</div>
    <div style="color:var(--text);font-size:.88rem">클릭하거나 드래그하여 스크린샷 업로드</div>
    <div style="color:var(--muted);font-size:.75rem;margin-top:3px">PNG · JPG · WEBP · GIF 지원</div>
  </div>
  <input type="file" id="fimg" accept="image/*" style="display:none" onchange="onUp(event)">
  <div class="cgrid">
    <div class="cg"><label>원본 단말기</label><select id="cSrc" onchange="onSrcCh()"><option value="manual">직접 입력</option></select></div>
    <div class="cg"><label>대상 단말기</label><select id="cDst" onchange="onDstCh()"></select></div>
    <div class="cg"><label>원본 해상도</label><div class="rpair"><input type="number" id="sw" value="1080"><span>×</span><input type="number" id="sh" value="2400"></div></div>
    <div class="cg"><label>대상 해상도</label><div class="rpair"><input type="number" id="dw" value="1440"><span>×</span><input type="number" id="dh" value="3088"></div></div>
  </div>
  <div class="ftog">
    <button class="fb on" onclick="setFit('fit',this)">📐 맞춤 (Fit) — 비율 유지</button>
    <button class="fb" onclick="setFit('fill',this)">✂️ 채움 (Fill) — 화면 가득</button>
  </div>
  <button class="cvbtn" onclick="doConv()">🔄 해상도 변환 미리보기</button>
  <div class="rswrap" id="rswrap">
    <div class="rsrow">
      <div class="rsframe"><div class="flab">원본</div><div class="fnm" id="fnSrc"></div><canvas id="cSrcC"></canvas><div class="ri" id="riSrc"></div></div>
      <div class="rsarrow">→</div>
      <div class="rsframe"><div class="flab">변환 결과</div><div class="fnm" id="fnDst"></div><canvas id="cDstC"></canvas><div class="ri" id="riDst"></div><button class="dlbtn" onclick="dlConv()">⬇️ 변환 이미지 저장</button></div>
    </div>
    <div class="cvinf" id="cvinf"></div>
  </div>
</div></div>
</div>
<div id="pg-ms" class="page">
<div class="ms-wrap"><div class="ms-card">
  <h2>📊 국가별 스마트폰 시장 점유율</h2>
  <p id="ms-meta"></p>
  <div class="rtabs" id="rtabs"></div>
  <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">
    <div style="flex:1;min-width:240px">
      <div class="ms-title" id="msTitle"></div>
      <div class="ms-sub" id="msSub"></div>
      <div id="msBars"></div>
      <div class="ms-src">※ 데이터는 추정치이며 실제 수치와 다를 수 있습니다.</div>
    </div>
    <div style="min-width:240px;max-width:300px;flex-shrink:0">
      <canvas id="pieCanvas" width="260" height="260"></canvas>
      <div class="pie-leg" id="pieLeg"></div>
    </div>
  </div>
</div></div>
</div>
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <div class="mhead"><div class="mi"><h2 id="mName"></h2><p id="mSub2"></p></div><button class="mcls" onclick="closeModal()">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

const EN_KO_MODEL={'ultra':'울트라','pro':'프로','max':'맥스','plus':'플러스','mini':'미니','fold':'폴드','flip':'플립','edge':'엣지','fe':'FE','note':'노트','lite':'라이트'};
function namuTitle(d){
  let n=d.name;
  if(d.brand==='Samsung')n=n.replace(/^Galaxy\s*/i,'갤럭시 ');
  else if(d.brand==='Apple')n=n.replace(/^iPhone\s*/i,'아이폰 ');
  else if(d.brand==='Google')n='구글 '+n.replace(/^Google\s*/i,'');
  else n=(d.brandKo||d.brand)+' '+n;
  Object.entries(EN_KO_MODEL).forEach(([en,ko])=>{n=n.replace(new RegExp('(?<![\\w가-힣])'+en+'(?![\\w가-힣])','gi'),ko);});
  return n.replace(/\s+/g,' ').trim();
}

function debSearch(){clearTimeout(stTimer);stTimer=setTimeout(doSearch,220)}

function doSearch(){
  const raw=document.getElementById('q').value.trim();
  const q=koEn(raw);
  const brand=document.getElementById('fBrand').value;
  const os=document.getElementById('fOS').value;
  const year=document.getElementById('fYear').value;
  const sort=document.getElementById('fSort').value;

  let list=DEVICES.filter(d=>{
    if(brand&&d.brand!==brand)return false;
    if(year&&d.year!==+year)return false;
    if(os&&!d.os.toLowerCase().includes(os.toLowerCase()))return false;
    if(raw){
      const hay=koEn(`${d.brand} ${d.brandKo||''} ${d.name} ${d.chip} ${d.ux} ${d.os}`);
      if(!hay.includes(q))return false;
    }
    return true;
  });

  if(sort==='year')     list.sort((a,b)=>b.year-a.year||a.name.localeCompare(b.name));
  else if(sort==='name')    list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='display') list.sort((a,b)=>b.disp.inch-a.disp.inch);
  else if(sort==='ppi')     list.sort((a,b)=>b.disp.ppi-a.disp.ppi);
  else if(sort==='antutu')  list.sort((a,b)=>(b.bench?.antutu||0)-(a.bench?.antutu||0));

  document.getElementById('stats').textContent=`총 ${list.length}개 단말기 (전체 ${DEVICES.length}개)`;
  renderGrid(list);
  const gsmR=document.getElementById('gsmRes');
  if(raw.length>=2){
    gsmR.innerHTML='';
    searchNamu(raw);
  } else {
    gsmR.innerHTML='';
  }
}

async function fetchProxy(url,signal){
  try{const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:signal||AbortSignal.timeout(14000)});if(r.ok){const t=await r.text();if(t.length>500)return t;}}catch(e){if(signal?.aborted)return null;}
  try{const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url),{signal:signal||AbortSignal.timeout(14000)});if(r.ok){const j=await r.json();if(j.contents?.length>500)return j.contents;}}catch(e){}
  return null;
}

function parseNamuContent(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const title=doc.querySelector('h1')?.textContent?.trim()||doc.querySelector('meta[property="og:title"]')?.getAttribute('content')||'';
  const img=doc.querySelector('.wiki-image img,figure img,.infobox img')?.getAttribute('src')||'';
  const sections=[];
  doc.querySelectorAll('table').forEach((tbl,i)=>{
    const rows=[];
    tbl.querySelectorAll('tr').forEach(tr=>{
      const tds=tr.querySelectorAll('td');
      if(tds.length>=2){const k=tds[0].textContent.trim().replace(/\s+/g,' ');const v=tds[1].textContent.trim().replace(/\s+/g,' ');if(k&&v&&k.length<60)rows.push({key:k,val:v});}
    });
    if(rows.length>2)sections.push({title:'',rows});
  });
  return{title,img,sections};
}

function parseNamuSearch(html){
  // Next.js __NEXT_DATA__ 우선 파싱
  const m=html.match(/<script[^>]+id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
  if(m){
    try{
      const data=JSON.parse(m[1]);
      const raw=data?.props?.pageProps?.searchResult||data?.props?.pageProps?.searchResults
        ||data?.props?.pageProps?.result||data?.props?.pageProps?.items||data?.props?.pageProps?.data;
      if(Array.isArray(raw)&&raw.length){
        return raw.slice(0,20).map(item=>{
          const t=item.title||item.name||item.key||String(item);
          return{name:t,slug:'/w/'+encodeURIComponent(t),sub:item.snippet||''};
        }).filter(i=>i.name.length>1);
      }
    }catch(e){}
  }
  const doc=new DOMParser().parseFromString(html,'text/html');
  const items=[];const seen=new Set();
  // 검색결과 컨테이너 우선
  doc.querySelectorAll('[class*="search"] a[href^="/w/"],[class*="result"] a[href^="/w/"],[class*="Search"] a[href^="/w/"]').forEach(a=>{
    const href=a.getAttribute('href')||'';const name=a.textContent.trim().replace(/\s+/g,' ');
    if(name&&name.length>1&&href&&!seen.has(href)){seen.add(href);items.push({name,slug:href,sub:''});}
  });
  if(items.length)return items.slice(0,20);
  // 전체 /w/ 링크 폴백
  doc.querySelectorAll('a[href^="/w/"]').forEach(a=>{
    const href=a.getAttribute('href')||'';const name=a.textContent.trim().replace(/\s+/g,' ');
    if(name&&name.length>1&&href&&!seen.has(href)){seen.add(href);items.push({name,slug:href,sub:''});}
  });
  return items.slice(0,20);
}

async function searchNamu(q){
  const sec=document.getElementById('gsmRes');
  if(!sec||!q)return;
  sec.innerHTML=`<div class="gsr-hd"><div class="spin"></div><span>나무위키에서 "<strong>${q}</strong>" 검색 중...</span></div>`;
  let items=null;

  // 0차: 나무위키 자동완성 API 직접 호출 (CORS 허용 시)
  for(const apiUrl of [
    'https://namu.wiki/api/autocomplete?query='+encodeURIComponent(q),
    'https://namu.wiki/api/search?query='+encodeURIComponent(q),
  ]){
    if(items)break;
    try{
      const r=await fetch(apiUrl,{signal:AbortSignal.timeout(5000),headers:{'Accept':'application/json'}});
      if(r.ok){
        const data=await r.json();
        const raw=Array.isArray(data)?data:(data?.items||data?.results||data?.searchResults||[]);
        if(raw.length){
          items=raw.slice(0,20).map(t=>{
            const name=typeof t==='string'?t:(t.title||t.name||'');
            return{name,slug:'/w/'+encodeURIComponent(name),sub:t.snippet||''};
          }).filter(i=>i.name.length>1);
        }
      }
    }catch(e){}
  }

  // 1차: 서버 프록시
  if(!items){
    try{const r=await fetch('/api/namu-search?q='+encodeURIComponent(q),{signal:AbortSignal.timeout(5000)});if(r.ok){const d=await r.json();if(d.items?.length)items=d.items;}}catch(e){}
  }

  // 2차: CORS 프록시 + 파싱
  if(!items){
    const html=await fetchProxy('https://namu.wiki/Search?q='+encodeURIComponent(q));
    if(html)items=parseNamuSearch(html);
  }

  if(!items?.length){
    sec.innerHTML=`<div class="gsr-hd" style="color:var(--muted)">나무위키 검색 결과를 가져올 수 없습니다.
      <a href="https://namu.wiki/Search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener" style="margin-left:8px;color:var(--acc)">나무위키에서 직접 검색 →</a></div>`;
    return;
  }
  sec.innerHTML=`<div class="gsr-hd">📖 나무위키 검색 결과 · ${items.length}개</div>
  <div class="gsr-grid">${items.map(it=>`
    <div class="gsr-card" onclick="openNamuModal('${it.slug.replace(/'/g,"\\'")}','${it.name.replace(/'/g,"\\'")}')">
      <div class="gsr-thumb" style="background:rgba(0,200,100,.08);display:flex;align-items:center;justify-content:center;font-size:1.2rem">📖</div>
      <div><div class="gsr-name">${it.name}</div><div class="gsr-sub">${it.sub||it.name}</div></div>
    </div>`).join('')}
  </div>`;
}

  loadNamuInline(slug);
}

function closeModal(){document.getElementById('overlay').classList.remove('on')}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeModal()}

async function loadNamuInline(titleOrPath){
  if(_namuCtrl)_namuCtrl.abort();
  _namuCtrl=new AbortController();
  const ctrl=_namuCtrl;const signal=ctrl.signal;
  const sec=document.getElementById('namuSec');
  if(!sec)return;
  let sections=null,title='',img='';
  const namuUrl= titleOrPath.startsWith('/w/')
    ? 'https://namu.wiki'+titleOrPath
    : 'https://namu.wiki/w/'+encodeURIComponent(titleOrPath);
  try{
    const slug=titleOrPath.startsWith('/w/')?titleOrPath.slice(3):encodeURIComponent(titleOrPath);
    const r=await fetch('/api/namu?title='+slug,{signal:AbortSignal.timeout(2000)});
    if(r.ok){const d=await r.json();if(d.ok&&d.sections?.length){sections=d.sections;title=d.title||'';img=d.img||'';}}
  }catch(e){}
  if(signal.aborted)return;
  if(!sections){
    const sp=sec.querySelector('span');if(sp)sp.textContent='외부 프록시로 불러오는 중...';
    const html=await fetchProxy(namuUrl,signal);
    if(signal.aborted)return;
    if(html){const p=parseNamuContent(html);sections=p.sections;title=p.title;img=p.img;}
  }
  if(signal.aborted)return;
  const sec2=document.getElementById('namuSec');if(!sec2)return;
  if(!sections?.length){sec2.innerHTML=namuFallback(namuUrl);return}
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <strong style="color:var(--acc);font-size:.88rem">📖 나무위키 정보</strong>
    <a href="${namuUrl}" target="_blank" rel="noopener" style="font-size:.75rem;color:var(--muted);text-decoration:none">나무위키에서 보기 →</a>
  </div>`;
  if(img)html+=`<img src="${img}" style="max-width:80px;display:block;margin:0 auto 14px;border-radius:8px" onerror="this.style.display='none'">`;
  sections.forEach(s=>{
    html+=`<div><div class="gsec-hd">${s.title||'정보'}</div><table class="gsec-tbl">`;
    s.rows.forEach(row=>html+=`<tr><td>${row.key}</td><td>${row.val}</td></tr>`);
    html+='</table></div>';
  });
  sec2.innerHTML=html;
}
function namuFallback(url){
  return `<div style="text-align:center;color:var(--muted);padding:12px 0;font-size:.82rem">
    <p style="margin-bottom:10px">나무위키 정보를 불러올 수 없습니다.</p>
    <a class="gsm-btn" href="${url}" target="_blank" rel="noopener">📖 나무위키에서 직접 보기 →</a>
  </div>`;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// ── converter ─────────────────────────────────────────────────────────────────
function setFit(m,btn){fitMode=m;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function onUp(e){
  const f=e.target.files[0];if(!f)return;
  const rdr=new FileReader();
  rdr.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      upImg=img;
      document.getElementById('upzone').innerHTML=`<div style="color:var(--ok);font-size:1.2rem;margin-bottom:5px">✓ 업로드 완료</div><div style="color:var(--text);font-size:.85rem">${f.name}</div><div style="color:var(--muted);font-size:.75rem;margin-top:3px">${img.width}×${img.height}px</div>`;
      document.getElementById('sw').value=img.width;document.getElementById('sh').value=img.height;
      document.getElementById('cSrc').value='manual';
    };img.src=ev.target.result;
  };rdr.readAsDataURL(f);
}
const uz=document.getElementById('upzone');
uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag')});
uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
uz.addEventListener('drop',e=>{e.preventDefault();uz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const dt=new DataTransfer();dt.items.add(f);document.getElementById('fimg').files=dt.files;onUp({target:{files:[f]}})}});
function onSrcCh(){const v=document.getElementById('cSrc').value;if(v==='manual')return;const d=DEVICES.find(x=>x.id===+v);if(d){document.getElementById('sw').value=d.disp.w;document.getElementById('sh').value=d.disp.h}}
function onDstCh(){const d=DEVICES.find(x=>x.id===+document.getElementById('cDst').value);if(d){document.getElementById('dw').value=d.disp.w;document.getElementById('dh').value=d.disp.h}}
function doConv(){
  if(!upImg){alert('먼저 스크린샷 이미지를 업로드하세요!');return}
  const sw=+document.getElementById('sw').value||upImg.width,sh=+document.getElementById('sh').value||upImg.height;
  const dw=+document.getElementById('dw').value,dh=+document.getElementById('dh').value;
  if(!dw||!dh){alert('대상 해상도를 입력하세요!');return}
  const M=360;
  const sc=document.getElementById('cSrcC'),sCtx=sc.getContext('2d');
  const ss=Math.min(M/sw,M*2/sh);sc.width=Math.round(sw*ss);sc.height=Math.round(sh*ss);sCtx.drawImage(upImg,0,0,sc.width,sc.height);
  const dc=document.getElementById('cDstC'),dCtx=dc.getContext('2d');
  const ds=Math.min(M/dw,M*2/dh);dc.width=Math.round(dw*ds);dc.height=Math.round(dh*ds);
  dCtx.fillStyle='#000';dCtx.fillRect(0,0,dc.width,dc.height);
  const iA=sw/sh,dA=dw/dh;let px,py,pw,ph;
  if(fitMode==='fit'){if(iA>dA){pw=dc.width;ph=pw/iA;px=0;py=(dc.height-ph)/2}else{ph=dc.height;pw=ph*iA;px=(dc.width-pw)/2;py=0}}
  else{if(iA>dA){ph=dc.height;pw=ph*iA;px=(dc.width-pw)/2;py=0}else{pw=dc.width;ph=pw/iA;px=0;py=(dc.height-ph)/2}}
  dCtx.drawImage(upImg,px,py,pw,ph);
  const srcD=DEVICES.find(x=>x.id===+document.getElementById('cSrc').value);
  const dstD=DEVICES.find(x=>x.id===+document.getElementById('cDst').value);
  document.getElementById('fnSrc').textContent=srcD?srcD.name:'원본';
  document.getElementById('fnDst').textContent=dstD?dstD.name:'변환 결과';
  document.getElementById('riSrc').textContent=`${sw}×${sh}px`;
  document.getElementById('riDst').textContent=`${dw}×${dh}px`;
  document.getElementById('cvinf').innerHTML=`<strong>변환 정보</strong><br>· 가로 배율 ${(dw/sw*100).toFixed(1)}% / 세로 배율 ${(dh/sh*100).toFixed(1)}%<br>· 픽셀 수: ${(sw*sh).toLocaleString()} → ${(dw*dh).toLocaleString()} (×${(dw*dh/(sw*sh)).toFixed(2)})<br>${srcD?.disp?.ppi&&dstD?.disp?.ppi?`· PPI: ${srcD.disp.ppi} → ${dstD.disp.ppi}<br>`:''}<strong>방식: ${fitMode==='fit'?'맞춤 (비율 유지)':'채움 (화면 가득)'}</strong>`;
  document.getElementById('rswrap').style.display='block';
  document.getElementById('rswrap').scrollIntoView({behavior:'smooth'});
}
function dlConv(){const a=document.createElement('a');a.download=`conv_${document.getElementById('dw').value}x${document.getElementById('dh').value}.png`;a.href=document.getElementById('cDstC').toDataURL();a.click()}

// ── market share ───────────────────────────────────────────────────────────────
function initMS(){
  document.getElementById('ms-meta').textContent=`최신 분기: ${MS_DATA.updated} · 출처: ${MS_DATA.source}`;
  const tabs=document.getElementById('rtabs');
  MS_DATA.regions.forEach((rg,i)=>{
    const b=document.createElement('button');
    b.className='rtab'+(i===0?' on':'');
    b.textContent=`${rg.flag} ${rg.name}`;
    b.onclick=()=>{document.querySelectorAll('.rtab').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderMS(rg)};
    tabs.appendChild(b);
  });
  renderMS(MS_DATA.regions[0]);
}
function renderMS(rg){
  document.getElementById('msTitle').textContent=`${rg.flag} ${rg.name}`;
  document.getElementById('msSub').textContent=`${MS_DATA.updated} 기준 · 출처: ${MS_DATA.source}`;
  document.getElementById('msBars').innerHTML=rg.data.map(item=>`
    <div class="ms-bar-row">
      <div class="ms-brand">${item.brandKo||item.brand}</div>
      <div class="ms-bar-wrap"><div class="ms-bar-fill" style="width:${item.share}%;background:${item.color}">${item.share>=8?`<span class="ms-bar-pct">${item.share}%</span>`:''}</div></div>
      <div class="ms-pct-out">${item.share<8?item.share+'%':''}</div>
    </div>`).join('');
  drawPie(rg.data);
}
function drawPie(data){
  const cv=document.getElementById('pieCanvas'),ctx=cv.getContext('2d');
  const cx=130,cy=130,r=110;
  ctx.clearRect(0,0,260,260);
  const tot=data.reduce((s,d)=>s+d.share,0);
  let ang=-Math.PI/2;
  data.forEach(item=>{const sl=item.share/tot*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+sl);ctx.closePath();ctx.fillStyle=item.color;ctx.fill();ang+=sl});
  ctx.beginPath();ctx.arc(cx,cy,52,0,Math.PI*2);ctx.fillStyle='#161630';ctx.fill();
  document.getElementById('pieLeg').innerHTML=data.map(item=>`<div class="pl-i"><div class="pl-d" style="background:${item.color}"></div><span>${item.brandKo||item.brand} ${item.share}%</span></div>`).join('');
}

// ── init ───────────────────────────────────────────────────────────────────────
function populateConv(){
  ['cSrc','cDst'].forEach((id,i)=>{
    const sel=document.getElementById(id);
    if(i===0)sel.innerHTML='<option value="manual">직접 입력</option>';else sel.innerHTML='';
    DEVICES.forEach(d=>sel.appendChild(new Option(`${d.brandKo||d.brand} ${d.name} (${d.disp.w}×${d.disp.h})`,d.id)));
  });
  const s24u=DEVICES.find(d=>d.name.includes('S24 Ultra'));
  if(s24u){document.getElementById('dw').value=s24u.disp.w;document.getElementById('dh').value=s24u.disp.h}
}
initBrands();
doSearch();
populateConv();
initMS();
</script>
